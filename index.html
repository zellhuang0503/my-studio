<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的品牌｜社群工作台</title>
<style>
  /* ===== 顏色和風格都在這裡改 ===== */
  :root {
    --main: #8a5a3b;
    --bg: #f6efe8;
    --text: #2b2420;
    --line: #e4d8cc;
    --radius: 10px;
    --font: "Microsoft JhengHei", "PingFang TC", sans-serif;
  }

  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); }
  button { font: inherit; font-size: 14px; border: 0; border-radius: calc(var(--radius) / 2); padding: 7px 14px; cursor: pointer; background: var(--main); color: #fff; }
  #btnAI:disabled { background: #999; cursor: wait; }
  #mSet select { width: 100%; padding: 8px; font: inherit; }
  #aiStatus.error { color: #b42318; }
  button.light { background: #fff; color: var(--main); border: 1px solid var(--line); }

  header { background: var(--main); color: #fff; padding: 12px 20px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 20px; flex: 1; }
  header button { background: rgba(255,255,255,.18); }

  main { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(280px, 1.2fr) 340px; gap: 20px; padding: 20px; max-width: 1300px; margin: 0 auto; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } .phone { margin: 0 auto; } }

  .box { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
  .box h2 { margin: 0 0 6px; font-size: 16px; color: var(--main); }
  label { display: block; font-size: 14px; margin: 12px 0 4px; }
  input, textarea { width: 100%; padding: 8px 10px; font: inherit; font-size: 14px; border: 1px solid var(--line); border-radius: calc(var(--radius) / 2); background: #fff; color: var(--text); }
  textarea { min-height: 70px; resize: vertical; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  #pictures { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 16px; }
  #picThumbs { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
  .pic-thumb { position: relative; width: 76px; height: 76px; }
  .pic-select { width: 100%; height: 100%; padding: 0; background: #fff; border: 3px solid var(--line); overflow: hidden; }
  .pic-select.selected { border-color: var(--main); }
  .pic-select img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .pic-delete { position: absolute; right: -6px; top: -6px; width: 24px; height: 24px; padding: 0; border-radius: 50%; background: #fff; color: var(--text); border: 1px solid var(--line); }
  #storageUsage { white-space: pre-line; }
  #storageUsage.error, #picStatus.error { color: #b42318; }
  .p-img { position: relative; overflow: hidden; }
  .p-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .line-pictures { min-width: 0; flex: 1; }
  .line-pictures .p-img { width: 100%; max-width: 230px; border-radius: 16px; margin-bottom: 8px; }
  .th > div:last-child { min-width: 0; flex: 1; }
  .ig-carousel { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .ig-carousel::-webkit-scrollbar { display: none; }
  .ig-slide { flex: 0 0 100%; scroll-snap-align: start; scroll-snap-stop: always; }
  .ig-dots { display: flex; justify-content: center; gap: 6px; padding: 10px 0 2px; }
  .ig-dots button { width: 7px; height: 7px; padding: 0; border-radius: 50%; background: var(--line); }
  .ig-dots button[aria-current="true"] { background: var(--main); }

  /* 平台分頁 */
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .tabs button { background: #fff; color: var(--main); border: 1px solid var(--line); }
  .tabs button.on { background: var(--main); color: #fff; }
  #post { min-height: 340px; line-height: 1.7; }
  .count { font-size: 13px; color: #888; text-align: right; margin-top: 4px; }

  #helper { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 14px; }
  #helperLog { max-height: 260px; overflow-y: auto; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
  #helperLog p { padding: 8px 10px; background: var(--bg); border-radius: var(--radius); }
  #helperForm { display: flex; gap: 8px; margin-top: 10px; }
  #helperInput { flex: 1; min-width: 0; }
  #helper button:disabled, #btnUndo:disabled { opacity: .5; cursor: default; }
  #helperStatus.error { color: #b42318; }

  /* 手機框 */
  .phone { width: 320px; height: 620px; border: 10px solid #111; border-radius: 36px; background: #fff; overflow-y: auto; align-self: start; font-size: 14px; }
  .p-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--main); flex: none; }
  .small { font-size: 12px; color: #888; }
  .p-text { padding: 0 12px 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .p-img { background: linear-gradient(135deg, var(--main), var(--bg)); display: flex; align-items: flex-end; }
  .p-img span { margin: 12px; padding: 6px 12px; background: rgba(255,255,255,.9); border-radius: var(--radius); font-size: 18px; font-weight: bold; }
  .wide { aspect-ratio: 4 / 3; }
  .square { aspect-ratio: 1 / 1; }
  .empty { color: #aaa; }
  .fb-bar { display: flex; justify-content: space-around; padding: 10px; border-top: 1px solid #eee; color: #555; }
  .ig-bar { padding: 8px 12px; font-size: 18px; letter-spacing: 6px; }
  .line-bg { background: #8fa9d4; min-height: 100%; padding: 12px; }
  .line-top { text-align: center; color: #fff; font-weight: bold; margin-bottom: 14px; }
  .line-row { display: flex; gap: 8px; align-items: flex-start; }
  .bubble { background: #fff; border-radius: 16px; padding: 10px 12px; white-space: pre-wrap; line-height: 1.6; max-width: 230px; word-break: break-word; }
  .th { display: flex; gap: 10px; padding: 14px 12px; }
  .th .p-text { padding: 4px 0 8px; }

  /* 跳出視窗 */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .modal.show { display: flex; }
  .modal .box { width: min(760px, 100%); max-height: 90vh; overflow: auto; }
  .modal textarea { min-height: 160px; }
  #checkCandidates .check-line, #checkReport .check-line { white-space: pre-wrap; overflow-wrap: anywhere; padding: 4px 8px; min-height: 1em; }
  #checkFixStatus.error { color: #b42318; }
  #mCheck button:disabled { opacity: .5; cursor: default; }
  .check-fireworks { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 30; }
  .check-celebration { position: absolute; top: max(24px, 12vh); left: 50%; transform: translateX(-50%); width: min(420px, calc(100% - 32px)); box-sizing: border-box; padding: 20px 24px; border: 2px solid #d8a135; border-radius: 18px; background: #fffcf2; color: #5a381c; box-shadow: 0 8px 40px #5a381c40; text-align: center; }
  .check-celebration strong { display: block; font-size: 24px; margin-bottom: 8px; }
  .check-celebration p { margin: 0; font-size: 16px; line-height: 1.7; white-space: pre-line; }
  .check-spark { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--spark-color); box-shadow: 0 0 8px var(--spark-color); animation: check-burst 1.7s ease-out both; }
  @keyframes check-burst { 0% { transform: translate(0, 0) scale(.3); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(var(--spark-x), var(--spark-y)) scale(.2); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .check-spark { animation: none; display: none; } }
  #checkReport .check-fail { background: #fee2e2; color: #991b1b; }
  #checkReport .check-warning { background: #fef3c7; color: #92400e; }
  .item { display: flex; gap: 8px; align-items: center; border-bottom: 1px solid var(--line); padding: 8px 0; }
  .item div { flex: 1; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #222; color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 14px; display: none; z-index: 20; }
</style>
</head>
<body>

<header>
  <h1 id="brandTitle">我的品牌｜社群工作台</h1>
  <button id="btnNew">＋ 新的一篇</button>
  <button id="btnList">📁 我的貼文</button>
  <button id="btnSet">⚙ 設定</button>
</header>

<main>
  <!-- 左邊：素材卡 -->
  <section class="box">
    <h2>素材卡</h2>
    <div id="fields"></div>
    <div class="actions">
      <button id="btnPrompt">🧩 組好指令</button>
      <button class="light" id="btnPaste">📥 貼回 AI 寫好的</button>
      <button class="light" id="btnSave">💾 存檔</button>
    </div>
    <div class="actions"><button id="btnAI">✨ 讓 AI 寫</button></div>
    <div id="aiStatus" class="small" role="status" style="white-space:pre-wrap"></div>
    <div id="aiUsage" class="small" role="status"></div>
    <section id="pictures" aria-labelledby="picturesTitle">
      <h2 id="picturesTitle">🖼 這篇的圖</h2>
      <button type="button" id="btnUpload">📤 上傳</button>
      <input id="picFiles" type="file" accept="image/*" multiple hidden>
      <div id="picThumbs"></div>
      <div id="storageUsage" class="small" role="status"></div>
      <div id="picStatus" class="small" role="status"></div>
    </section>
  </section>

  <!-- 中間：平台分頁＋貼文框 -->
  <section class="box">
    <div class="tabs" id="tabs"></div>
    <textarea id="post" placeholder="把這個平台的貼文貼在這裡…"></textarea>
    <div class="count" id="count">0 字</div>
    <div class="actions"><button class="light" id="btnCopy">📋 複製這一篇</button><button class="light" id="btnUndo" disabled>↩ 復原上一版</button></div>
    <div class="actions"><button class="light" id="btnCheck">🔍 檢查官</button></div>
    <div id="checkStatus" class="small" role="status" style="white-space:pre-wrap"></div>
    <div id="helper">
      <h2>💬 AI 小幫手</h2>
      <div id="helperLog" role="log" aria-label="目前平台的對話紀錄"></div>
      <div class="actions" id="helperShortcuts">
        <button type="button" class="light" data-edit="短一點">短一點</button>
        <button type="button" class="light" data-edit="換開頭">換開頭</button>
        <button type="button" class="light" data-edit="少一點 emoji">少一點 emoji</button>
        <button type="button" class="light" data-edit="更像範例">更像範例</button>
      </div>
      <form id="helperForm">
        <input id="helperInput" aria-label="修改要求" placeholder="想怎麼改這篇貼文？" autocomplete="off">
        <button id="helperSend" type="submit">送出</button>
      </form>
      <div id="helperStatus" class="small" role="status"></div>
    </div>
  </section>

  <!-- 右邊：手機預覽 -->
  <section class="phone" id="phone"></section>
</main>

<!-- 檢查官報告 -->
<div class="modal" id="mCheck" role="dialog" aria-modal="true" aria-labelledby="checkTitle"><div class="box">
  <h2 id="checkTitle">🔍 檢查官報告</h2>
  <div id="checkReport"></div>
  <div id="checkQuestions"></div>
  <details id="checkCandidatePanel"><summary>查看各平台最新修訂稿（通過檢查後自動匯入）</summary><div id="checkCandidates"></div></details>
  <div id="checkFixStatus" class="small" role="status" style="white-space:pre-wrap"></div>
  <div class="actions"><button id="btnCheckFix" disabled>✨ 一鍵修改</button><button id="btnCheckReply" disabled>💬 依我的回覆修改</button><button class="light" id="btnCheckAgain">🔍 重新檢查</button><button class="light" data-close>關閉</button></div>
</div></div>

<!-- 設定 -->
<div class="modal" id="mSet"><div class="box">
  <h2>⚙ 設定</h2>
  <h3>第一組 OpenRouter</h3>
  <label for="setAIKey">OpenRouter 金鑰</label>
  <input id="setAIKey" type="password" autocomplete="off">
  <label for="setModel">模型</label>
  <select id="setModel">
    <optgroup label="DeepSeek">
      <option>deepseek/deepseek-v4.1-flash</option><option>deepseek/deepseek-v4-pro</option><option>deepseek/deepseek-v3.2</option>
    </optgroup>
    <optgroup label="Kimi">
      <option>moonshotai/kimi-k2.6</option><option>moonshotai/kimi-k2.5</option><option>moonshotai/kimi-k3</option>
    </optgroup>
    <optgroup label="MiniMax">
      <option>minimax/minimax-m3</option><option>minimax/minimax-m2.7</option><option>minimax/minimax-m2.5</option>
    </optgroup>
  </select>
  <label for="setCustomModel">或自己打模型名稱</label><input id="setCustomModel">
  <label for="setEffort">思考</label>
  <select id="setEffort"><option value="low">少想一點 low</option><option value="medium">多想一點 medium</option><option value="high">想很久 high</option></select>
  <h3>第二組 Gemini</h3>
  <label for="setGeminiKey">Gemini 金鑰</label><input id="setGeminiKey" type="password" autocomplete="off">
  <label for="setGeminiModel">Gemini 模型</label>
  <select id="setGeminiModel"><option>gemini-3.8-flash</option><option>gemini-3.6-flash</option><option>gemini-3.5-flash-lite</option><option>gemini-3.1-flash-lite</option></select>
  <label for="setProvider">先用哪一組</label>
  <select id="setProvider"><option value="auto">先用 OpenRouter 失敗了自動換 Gemini</option><option value="gemini">只用 Gemini</option><option value="openrouter">只用 OpenRouter</option></select>
  <label>品牌規格（把 品牌規格.md 整份貼進來）</label>
  <textarea id="setSpec" style="min-height:260px"></textarea>
  <label>檢查清單（可以不填）</label>
  <textarea id="setCheck"></textarea>
  <div class="actions"><button id="btnSetSave">儲存</button><button class="light" data-close>關閉</button></div>
</div></div>

<!-- 組好的指令 -->
<div class="modal" id="mPrompt"><div class="box">
  <h2>🧩 組好的指令</h2>
  <p class="small">按「複製」，貼到 Codex 新對話（或 ChatGPT）。寫好以後，按「📥 貼回 AI 寫好的」。</p>
  <textarea id="promptText" style="min-height:360px" readonly></textarea>
  <div class="actions"><button id="btnPromptCopy">複製</button><button class="light" data-close>關閉</button></div>
</div></div>

<!-- 貼回 -->
<div class="modal" id="mPaste"><div class="box">
  <h2>📥 貼回 AI 寫好的</h2>
  <p class="small">把 AI 的回覆整段貼進來，它會照【平台】的標題，自動分到每個分頁。</p>
  <textarea id="pasteText" style="min-height:300px"></textarea>
  <div class="actions"><button id="btnPasteGo">分到各平台</button><button class="light" data-close>關閉</button></div>
  <div id="pasteAsk" class="small" style="white-space:pre-wrap"></div>
</div></div>

<!-- 我的貼文 -->
<div class="modal" id="mList"><div class="box">
  <h2>📁 我的貼文</h2>
  <div id="list"></div>
  <div class="actions"><button class="light" data-close>關閉</button></div>
</div></div>

<div id="toast"></div>

<script>
  const PIC_SIZE = { FB: [1080, 1080], IG: [1080, 1350], LINE: [1040, 1040], Threads: [1080, 1350] };
  const AI_MODEL = 'deepseek/deepseek-v4.1-flash';
  // ===== 我的品牌、平台、欄位都在這裡改 =====
  const BRAND = { name: '小島咖啡', account: 'xiaodao.coffee' };
  const PLATFORMS = ['FB', 'IG', 'LINE'];   // 可以用：FB、IG、LINE、Threads
  const FIELDS = [
    { id: 'date',   label: '活動日期',             type: 'date' },
    { id: 'topic',  label: '活動名稱',             type: 'text',     ph: '例：開店七週年' },
    { id: 'detail', label: '內容、價格、時間',     type: 'textarea', ph: '以島哥最後一次說的為準' },
    { id: 'who',    label: '誰可以、怎麼參加',     type: 'text' },
    { id: 'only',   label: '只能在 LINE 講的',     type: 'text' },
    { id: 'secret', label: '先不要講的',           type: 'text' },
    { id: 'words',  label: '島哥這次說不要用的字', type: 'text' },
    { id: 'ask',    label: '❓ 還不確定的',         type: 'textarea' }
  ];

  // ===== 下面是程式，不用改 =====
  const $ = id => document.getElementById(id);
  const K_DRAFT = 'demo-draft', K_POSTS = 'demo-posts', K_SET = 'demo-settings';
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } };
  const failedWrites = new Set();
  const pictureSources = new Map(), durablePictures = new Set();
  let pictureDBPromise, pictureCount = 0, pictureStorageError = '', usageVersion = 0;
  function pictureDB() {
    if (!pictureDBPromise) pictureDBPromise = new Promise((resolve, reject) => {
      const request = indexedDB.open('studio-images', 1);
      request.onupgradeneeded = () => request.result.createObjectStore('imgs');
      request.onsuccess = () => {
        const db = request.result;
        db.onversionchange = () => { db.close(); pictureDBPromise = null; };
        resolve(db);
      };
      request.onerror = () => { pictureDBPromise = null; reject(request.error); };
      request.onblocked = () => { pictureStorageError = '⚠️ 圖片儲存尚未就緒，請關閉其他工作台分頁後重試。'; storageUsage(); };
    });
    return pictureDBPromise;
  }
  async function imageTransaction(mode, action) {
    const db = await pictureDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('imgs', mode), images = tx.objectStore('imgs');
      let result;
      tx.oncomplete = () => resolve(result);
      tx.onabort = () => reject(tx.error || new Error('圖片儲存中斷'));
      tx.onerror = () => {};
      try { result = action(images); } catch (error) { tx.abort(); reject(error); }
    });
  }
  async function pictureRecord(src) {
    const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(src));
    const id = Array.from(new Uint8Array(digest), b => b.toString(16).padStart(2, '0')).join('');
    return { id, src };
  }
  async function refreshPictureUsage() {
    let count = 0;
    await imageTransaction('readonly', images => {
      const request = images.count();
      request.onsuccess = () => { count = request.result; };
    });
    pictureCount = count; storageUsage();
  }
  async function loadPictureSources(ids) {
    const loaded = new Map();
    await imageTransaction('readonly', images => {
      for (const id of ids) {
        const request = images.get(id);
        request.onsuccess = () => { if (typeof request.result === 'string') loaded.set(id, request.result); };
      }
    });
    // Preserve references created by the earlier Blob-based image warehouse.
    const missing = [...ids].filter(id => !loaded.has(id));
    if (missing.length && indexedDB.databases && (await indexedDB.databases()).some(db => db.name === 'my-studio-images')) {
      const legacy = await new Promise((resolve, reject) => {
        const request = indexedDB.open('my-studio-images');
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
      try {
        if (legacy.objectStoreNames.contains('images')) {
          const blobs = await new Promise((resolve, reject) => {
            const tx = legacy.transaction('images'), found = new Map();
            for (const id of missing) {
              const request = tx.objectStore('images').get(id);
              request.onsuccess = () => { if (request.result?.blob) found.set(id, request.result.blob); };
            }
            tx.oncomplete = () => resolve(found);
            tx.onabort = () => reject(tx.error);
          });
          for (const [id, blob] of blobs) {
            const src = await new Promise((resolve, reject) => {
              const reader = new FileReader(); reader.onload = () => resolve(reader.result);
              reader.onerror = () => reject(reader.error); reader.readAsDataURL(blob);
            });
            loaded.set(id, src);
          }
          await imageTransaction('readwrite', images => {
            for (const id of missing) if (loaded.has(id)) images.put(loaded.get(id), id);
          });
        }
      } finally { legacy.close(); }
    }
    for (const [id, src] of loaded) { pictureSources.set(id, src); durablePictures.add(id); }
    if ([...ids].some(id => !loaded.has(id))) throw new Error('部分圖片無法讀取，原貼文與圖片編號已保留');
  }
  async function removeUnusedPicture(id) {
    // Do not delete if storage is unreadable or any current/saved reference still exists.
    const posts = JSON.parse(localStorage.getItem(K_POSTS) || '[]');
    const draft = JSON.parse(localStorage.getItem(K_DRAFT) || 'null');
    if (!Array.isArray(posts)) throw new Error('貼文資料格式無法讀取');
    if ([cur, draft, ...posts].some(post => post?.pictures?.some(pic => pic.id === id || pic.src))) return;
    await imageTransaction('readwrite', images => images.delete(id));
    pictureSources.delete(id); durablePictures.delete(id);
    await refreshPictureUsage();
  }
  async function persistPicture(src) {
    const record = await pictureRecord(src);
    await imageTransaction('readwrite', images => images.put(record.src, record.id));
    durablePictures.add(record.id); pictureSources.set(record.id, src);
    pictureStorageError = '';
    await refreshPictureUsage();
    return { id: record.id };
  }
  // Migrate only after all image writes commit. Failed writes leave the original localStorage record intact.
  async function migratePictures() {
    const snapshots = [K_DRAFT, K_POSTS].map(key => ({ key, raw: localStorage.getItem(key) }));
    const records = new Map(), sources = new Map(), existing = new Set();
    for (const entry of snapshots) {
      if (!entry.raw) continue;
      entry.value = JSON.parse(entry.raw);
      const drafts = entry.key === K_POSTS ? entry.value : [entry.value];
      if (!Array.isArray(drafts)) throw new Error('貼文資料格式無法搬移');
      for (const draft of drafts) {
        if (!draft || !Array.isArray(draft.pictures)) continue;

    const platforms = PLATFORMS.filter(p => (review.candidatePosts[p] || '').trim());
    const result = await askAI([
      { role: 'system', content: `你是【${BRAND.name}】的貼文編輯。依檢查報告修正最新修訂稿的所有 ❌ 與明確修改建議；已符合的內容保留。品牌規格與素材卡是事實依據，不得新增未提供的事實。人工回覆是本次素材的補充事實與決定，以最後回答為準，依已回答的項目修改；未回答的 ⚠️ 不可猜測。請特別核對驚嘆號數量及台灣繁體用語。只回覆 JSON 物件，鍵為平台名稱、值為修改後完整貼文的字串；必須完整包含這些平台：${platforms.join('、')}。不要加 Markdown、說明或報告。` },
      { role: 'user', content: `${checkSource(review)}\n\n===== 本輪檢查報告 =====\n${review.report}` }
    ]);
    requireCurrentReview(review);
    if (/回覆可能被切掉/.test(result.warning || '')) throw new Error('修改回覆被截斷，修訂稿已保留，尚未匯入。請重試。');
    const revised = parseCheckedEdits(result.text, platforms);
    const before = JSON.stringify(review.candidatePosts);
    platforms.forEach(p => review.candidatePosts[p] = revised[p].trim());
    review.valid = false;
    renderCheckReview(review);
    return before !== JSON.stringify(review.candidatePosts);
  }
  async function continueCheckedPosts(review) {
    for (let round = 1; round <= MAX_CHECK_ROUNDS; round++) {
      $('checkFixStatus').textContent = `第 ${round} 輪自動修改（每次最多 ${MAX_CHECK_ROUNDS} 輪）…`;
      const changed = await repairCheckedPosts(review);
      await inspectCheckedPosts(review);
      if (finishCheckedPosts(review)) return;
      if (checkPending(review)) {
        $('checkFixStatus').textContent = '修訂稿已保留，尚未匯入：仍有人工待確認項目，請填寫回覆後按「依我的回覆修改」。';
        return;
      }
      if (!changed) {
        $('checkFixStatus').textContent = 'AI 沒有改動貼文，但仍有錯誤。修訂稿已保留，尚未匯入；可按「一鍵修改」重試，或重新檢查。';
        return;
      }
    }
    $('checkFixStatus').textContent = `已連續修改 ${MAX_CHECK_ROUNDS} 輪，仍未通過。修訂稿已保留，尚未匯入；可按「一鍵修改」繼續。`;
  }
  async function startCheckedPosts(reuse = false) {
    if (checkBusy || helperBusy || $('btnAI').disabled) return;
    if (!PLATFORMS.some(p => (cur.posts[p] || '').trim())) { toast('還沒有貼文可以檢查'); return; }
    cancelCheckCelebration();
    const review = reuse && checkReview && reviewMatches(checkReview) ? checkReview : createCheckReview();
    checkReview = review;
    open('mCheck');
    setCheckBusy(true);
    try {
      await inspectCheckedPosts(review);
      if (!finishCheckedPosts(review)) $('checkFixStatus').textContent = checkPending(review) ? '請填寫人工回覆；可先用「一鍵修改」處理明確錯誤，修訂稿通過前不匯入。' : '發現錯誤，按「一鍵修改」後會持續修改及複查，通過才匯入。';
    } catch (error) { showCheckError(error); }
    finally { setCheckBusy(false); }
  }
  function showCheckError(error) {
    $('checkFixStatus').classList.add('error');
    $('checkFixStatus').textContent = error.message;
    $('checkStatus').textContent = '尚未完成，修訂稿未匯入；請在檢查報告視窗查看原因。';
  }
  async function fixCheckedPosts(withReplies = false) {
    const review = checkReview;
    if (!review || checkBusy || helperBusy || $('btnAI').disabled) return;
    try { requireCurrentReview(review); } catch (error) { showCheckError(error); return; }
    const replies = withReplies ? review.questions.filter(q => q.answer.trim()).map(q => `${q.text}\n人工回覆：${q.answer.trim()}`) : [];
    if (withReplies && !replies.length) { $('checkFixStatus').textContent = '請至少填寫一項人工回覆，未填寫的項目可以稍後確認。'; return; }
    review.confirmations.push(...replies);
    if (withReplies) review.questions.filter(q => q.answer.trim()).forEach(q => q.submitted = true);
    setCheckBusy(true);
    try {
      // 前次修改後若複查失敗，必須先複查最新稿，不能拿舊報告盲改。
      if (!review.valid && !withReplies) {
        await inspectCheckedPosts(review);
        if (finishCheckedPosts(review)) return;
      }
      await continueCheckedPosts(review);
    } catch (error) { showCheckError(error); }
    finally { setCheckBusy(false); }
  }
  $('btnCheck').onclick = () => startCheckedPosts(true);
  $('btnCheckAgain').onclick = () => startCheckedPosts(true);
  $('btnCheckFix').onclick = () => fixCheckedPosts();
  $('btnCheckReply').onclick = () => fixCheckedPosts(true);
  $('btnAI').onclick = async () => {
    const button = $('btnAI'), status = $('aiStatus');
    if (button.disabled || helperBusy) return;
    const draft = cur;
    button.disabled = true;
    renderHelper();
    button.textContent = '✨ AI 寫作中…';
    status.classList.remove('error');
    status.textContent = '';
    showUsage();
    try {
      const result = await askAI(buildPrompt());
      const text = result.text;
      const notices = [result.warning];
      showUsage(result.usage);
      if (cur !== draft) {
        $('pasteText').value = text;
        $('pasteAsk').textContent = '';
        notices.push('已切換貼文，AI 回覆放在「📥 貼回」視窗，請確認後再分到各平台。');
        open('mPaste');
      } else {
        notices.push(applyAIText(text));
        if (!PLATFORMS.some(p => text.includes(`【${p}】`))) {
          notices.push('可以用 📥 貼回 手動分。');
          $('pasteText').value = text;
          $('pasteAsk').textContent = notices.filter(Boolean).join('\n');
          open('mPaste');
        }
      }
      status.textContent = notices.filter(Boolean).join('\n');
    } catch (error) {
      status.classList.add('error');
      status.textContent = error.message;
    } finally {
      button.disabled = false;
      button.textContent = '✨ 讓 AI 寫';
      renderHelper();
    }
  };
  showUsage();
  // 即使頁面一直開著，跨日後也會更新今天的統計。
  setInterval(() => { if (load(K_AI_USAGE, {}).day !== aiDay()) showUsage(); }, 60000);

  // 小幫手與上一版都跟著這篇貼文儲存；各平台的對話分開。
  let helperBusy = false;
  function renderHelper() {
    const history = cur.chats?.[cur.tab] || [];
    $('helperLog').replaceChildren();
    history.forEach(message => {
      const row = document.createElement('p');
      row.textContent = `${message.role === 'user' ? '我' : 'AI 小幫手'}：${message.content}`;
      $('helperLog').appendChild(row);
    });
    $('helperLog').scrollTop = $('helperLog').scrollHeight;
    const busy = helperBusy || $('btnAI').disabled;
    document.querySelectorAll('#helper button').forEach(button => button.disabled = busy);
    $('helperInput').disabled = busy;
    $('btnUndo').disabled = busy || !cur.previousPosts;
    $('helperStatus').textContent = helperBusy ? 'AI 修改中…' : '';
    $('helperStatus').classList.remove('error');
  }
  $('btnUndo').onclick = () => {
    if (!cur.previousPosts || helperBusy || $('btnAI').disabled) return;
    const current = { ...cur.posts };
    cur.posts = { ...cur.previousPosts };
    cur.previousPosts = current;
    fill();
    toast('已交換目前內容與上一版，再按一次可換回來');
  };
  async function editPost(instruction) {
    if (helperBusy || $('btnAI').disabled) return;
    if (!(cur.posts[cur.tab] || '').trim()) { toast('先讓 AI 寫一篇'); return; }
    instruction = instruction.trim();
    if (!instruction) { toast('請輸入修改要求'); return; }
    const draft = cur, platform = cur.tab, original = cur.posts[platform];
    const settings = load(K_SET, {});
    const card = FIELDS.map(f => `${f.label}：${(f.type === 'date' ? dateText(cur.fields[f.id]) : cur.fields[f.id] || '') || '（空白）'}`).join('\n');
    const userMessage = { role: 'user', content: `目前的${platform}貼文：${original}。請這樣改：${instruction}` };
    const messages = [
      { role: 'system', content: `你是${BRAND.name}的小編助理。使用者會叫你修改一篇${platform}貼文。只改使用者要求的地方，其他保持原樣；不能加素材卡上沒有的事實；遵守品牌規格；一律用台灣的繁體中文和台灣用語。不要出現簡體字，也不要用大陸用語（例如：視頻→影片、質量→品質、優化→改善、信息→訊息、網絡→網路、用戶→客人或使用者）。只回覆改好以後的整篇貼文，不要解釋、不要加標題。\n\n===== 品牌規格 =====\n${settings.spec || ''}\n\n===== 素材卡 =====\n${card}` },
      ...(draft.chats?.[platform] || []).slice(-8),
      userMessage
    ];
    helperBusy = true;
    renderHelper();
    try {
      const result = await askAI(messages);
      showUsage(result.usage);
      if (cur !== draft || draft.posts[platform] !== original) {
        toast('貼文已切換或修改，這次回覆尚未套用');
        return;
      }
      draft.previousPosts = { ...draft.posts };
      draft.posts[platform] = result.text;
      draft.chats ||= {};
      draft.chats[platform] ||= [];
      draft.chats[platform].push({ role: 'user', content: instruction }, { role: 'assistant', content: result.text });
      $('helperInput').value = '';
      fill();
      $('aiStatus').classList.remove('error');
      $('aiStatus').textContent = result.warning || '';
    } catch (error) {
      $('helperStatus').classList.add('error');
      $('helperStatus').textContent = error.message;
    } finally {
      const errorText = $('helperStatus').classList.contains('error') ? $('helperStatus').textContent : '';
      helperBusy = false;
      renderHelper();
      if (errorText) {
        $('helperStatus').classList.add('error');
        $('helperStatus').textContent = errorText;
      }
    }
  }
  $('helperForm').onsubmit = event => { event.preventDefault(); editPost($('helperInput').value); };
  $('helperShortcuts').onclick = event => { if (event.target.dataset.edit) editPost(event.target.dataset.edit); };

  // 一鍵複製
  $('btnCopy').onclick = () => copy(cur.posts[cur.tab] || '', `${cur.tab} 已複製`);

  // 存檔
  $('btnSave').onclick = () => {
    const posts = load(K_POSTS, []);
    const name = [cur.fields.date || '', topic() || '未命名'].join(' ').trim();
    normalizePictures(cur);
    const rec = { id: cur.id || Date.now(), name, time: new Date().toLocaleString('zh-TW'), fields: { ...cur.fields }, posts: { ...cur.posts }, chats: cur.chats || {}, previousPosts: cur.previousPosts || null, pictures: cur.pictures.map(p => ({ ...p })), mainPicture: cur.mainPicture };
    const i = posts.findIndex(p => p.id === rec.id);
    if (i >= 0) posts[i] = rec; else posts.unshift(rec);
    if (!store(K_POSTS, posts)) return;
    cur.id = rec.id;
    if (!store(K_DRAFT, cur)) return;
    toast('存好了：' + name);
  };

  // 我的貼文
  function showList() {
    const posts = load(K_POSTS, []);
    $('list').innerHTML = posts.length ? posts.map(p =>
      `<div class="item"><div><b>${esc(p.name)}</b><div class="small">${esc(p.time)}</div></div>
       <button data-open="${p.id}">打開</button><button class="light" data-del="${p.id}">刪除</button></div>`).join('')
      : '<p class="small">還沒有存過的貼文。</p>';
  }
  $('btnList').onclick = () => { showList(); open('mList'); };
  $('list').onclick = async e => {
    let posts = load(K_POSTS, []);
    const o = e.target.dataset.open, d = e.target.dataset.del;
    if (o) {
      try { await migratePictures(); posts = load(K_POSTS, []); }
      catch (error) { pictureStorageError = '⚠️ 圖片尚未搬移完成，原資料已保留。' + error.message; storageUsage(); }
      const p = posts.find(p => String(p.id) === o); cur = { id: p.id, fields: { ...p.fields }, posts: { ...p.posts }, tab: PLATFORMS[0], chats: p.chats || {}, previousPosts: p.previousPosts || null, pictures: (p.pictures || []).map(pic => ({ ...pic })), mainPicture: p.mainPicture || null }; fill(); $('mList').classList.remove('show'); toast('打開：' + p.name); }
    if (d && confirm('確定要刪除這一篇嗎？')) { store(K_POSTS, posts.filter(p => String(p.id) !== d)); showList(); }
  };

  // 新的一篇
  $('btnNew').onclick = () => { if (confirm('清空畫面，開始新的一篇？（存過的不會不見）')) { cur = blank(); fill(); } };

  async function initializePictures() {
    const controls = [...document.querySelectorAll('header button, main button, main input, main textarea')].map(el => [el, el.disabled]);
    controls.forEach(([el]) => el.disabled = true);
    $('picStatus').textContent = '正在讀取與搬移圖片…';
    try { await migratePictures(); cur = load(K_DRAFT, blank()); }
    catch (error) { cur = load(K_DRAFT, cur); pictureStorageError = '⚠️ 圖片尚未搬移完成，原資料已保留。' + error.message; storageUsage(); }
    finally {
      controls.forEach(([el, disabled]) => el.disabled = disabled);
      $('picStatus').textContent = '';
      fill();
    }
  }
  initializePictures();
</script>

</body>
